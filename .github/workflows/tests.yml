name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Job loop against a scripted fake model
        run: python tests/selftest_harness.py
      - name: Commands and dispatcher against a fake Ollama server
        run: python tests/e2e_fake_ollama.py
